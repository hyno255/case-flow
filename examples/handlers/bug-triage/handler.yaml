# Handler plugin: judges cases. Behavior lives here; deployment lives on routes.
id: demo/bug-triage
version: 0.1.0
stages:
  - name: triage
    agent: ./triage.md           # the task: a document the default agent follows
                                 # (CASEFLOW_AGENT=mock dry-runs it without credentials)
    output_schema:
      severity: { enum: [low, medium, high, critical] }   # enum -> exact-checked in bench
      owner: string                                       # free string -> AI-judged in bench
      summary: string
writeback: ./writeback.sh
promotes:
  severity: triage.severity
  owner: triage.owner
