# docker compose up                                    the web UI on http://localhost:8321
# docker compose run --rm agentflow check              any command of the CLI
# docker compose run --rm agentflow run vuln-triage
services:
  agentflow:
    build: .
    image: agentflow
    init: true                          # ends what a stopped script leaves behind
    ports: ["127.0.0.1:8321:8321"]      # this machine only: there is no sign-in
    environment:
      TZ: ${TZ:-UTC}                    # schedules such as "weekdays 07:00" are read in this time zone
    env_file:
      - path: .env                      # model keys
        required: false
    volumes:
      - ./agentflow.yaml:/work/agentflow.yaml:ro
      - ./plugins:/work/plugins:ro      # flows, agents, tools (scripts and MCP servers), sources
      - ./data:/work/data               # the database, fetches and runs
      # - ~/code/product:/mnt/product:ro   # any other folder your scripts read
