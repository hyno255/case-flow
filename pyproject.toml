[project]
name = "agentflow"
version = "0.1.0"
description = "A small engine that runs triage flows: sources, tools, agents and flows as plugin folders."
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[openai,mcp]>=2.68,<3",   # mcp: a tool plugin can be an MCP server
  "pyyaml>=6",
  "markdown>=3.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.scripts]
agentflow = "agentflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentflow", "agentflow.web"]

[tool.setuptools.package-data]
"agentflow.web" = ["templates/*.html", "static/*"]
