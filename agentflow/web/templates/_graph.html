{# A flow drawn as boxes and arrows. Every position comes from draw.graph(); this file only draws. #}
{% macro draw(g, label) %}
<div class="graph">
<svg width="{{ g.width }}" height="{{ g.height }}" viewBox="0 0 {{ g.width }} {{ g.height }}" role="img" aria-label="{{ label }}">
  <defs>
    <marker id="g-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="g-head"/></marker>
    <marker id="g-arrow-fail" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="g-head fail"/></marker>
  </defs>
  {% for e in g.edges %}
  <path d="{{ e.d }}" class="g-edge {{ e.on }} {{ e.kind }}" marker-end="url(#g-arrow{{ '-fail' if e.on == 'fail' }})"><title>{{ e.src | replace(":", "") }} → {{ e.dst | replace(":", "") }} on {{ e.on }}</title></path>
  {% if e.label %}<text x="{{ e.lx }}" y="{{ e.ly }}" class="g-note" text-anchor="{{ e.anchor }}">{{ e.label }}</text>{% endif %}
  {% endfor %}
  {% for n in g.nodes %}
  {% if n.href %}<a href="{{ n.href }}">{% endif %}
  <g class="g-node {{ n.state }}">
    <title>{{ n.tip }}</title>
    <rect x="{{ n.x }}" y="{{ n.y }}" width="{{ n.w }}" height="{{ n.h }}" rx="7"/>
    <text x="{{ n.x + 12 }}" y="{{ n.y + 18 }}" class="g-kicker">{{ n.kicker }}</text>
    <text x="{{ n.x + 12 }}" y="{{ n.y + 37 }}" class="g-title">{{ n.title }}</text>
    {% for l in n.lines %}<text x="{{ n.x + 12 }}" y="{{ n.y + 55 + loop.index0 * g.line }}" class="g-line">{{ l }}</text>{% endfor %}
  </g>
  {% if n.href %}</a>{% endif %}
  {% endfor %}
</svg>
<p class="legend"><span><i></i>pass</span>{% if g.validated %}<span title="the stage it leads to runs again, told the reason"><i class="fail"></i>fail</span>{% endif %}</p>
</div>
{% endmacro %}
