# What you can set, and its default. Set any of these in agentflow.yaml under `limits`; a flow.yaml may set its own `limits`.
# They are the limits of a run and of the agent loop. What happens inside a flow is the flow's own business.

limits:
  at_once: 4                  # items worked on at the same time
  minutes_per_item: 10        # one item, all its stages together
  cost_per_run_usd: 2.00      # the run stops starting stages at this cost
  script_seconds: 120         # one script or one tool call
  model_calls: 20             # model requests in one agent run
  context_tokens: 100000      # when a request reads more than this, the agent's older tool results are cleared
  tries: 2                    # tries of a stage that names no `tries`

# The engine's own mechanics. These are not settings: agentflow.yaml cannot change them and no page lists them.
# They are here so that the code holds no number.

internal:
  health_seconds: 20          # one health check of a tool
  health_every_seconds: 300   # between the server's rounds of health checks
  health_stale_seconds: 900   # an older health answer is no longer trusted
  stop_grace_seconds: 2       # a script asked to stop gets this long before it is forced
  poll_seconds: 0.5           # how often a running script's time limit and a cancel are looked at
  heartbeat_seconds: 5        # between signs of life from a process doing a run
  stale_after_seconds: 60     # a run silent for this long is treated as interrupted
  schedule_every_seconds: 30  # between looks at which schedules are due
  watch_every_seconds: 15     # between looks for runs whose process is gone
  follow_seconds: 0.5         # how often `show --follow` asks for new events
  refresh_seconds: 5          # how often a page of a run that is still going is fetched again
  context_keep_results: 6     # the latest tool results an agent keeps when older ones are cleared
  read_chars: 20000           # of a file, given to the agent that reads it
  tool_chars: 8000            # of a tool's answer, given to the agent that called it
  reason_chars: 2000          # of a failed check's or tool's output: what the next try is told
  error_chars: 500            # of an error or a failed script's output, kept as the reason
  event_chars: 1500           # of a tool's answer or a script's output, kept in the trace
  rows: 50                    # rows in a list
  line_chars: 200             # of a value in one line of a log or a table
  label_chars: 40             # the longest text value used in an item's title
  fact_chars: 400             # of a value shown as a fact in the trace
  block_chars: 4000           # of arguments, an answer or an output shown in the trace
  prompt_chars: 20000         # of a prompt shown in the trace
  file_chars: 100000          # of a file shown on a page
  raw_chars: 200000           # of a file served as plain text
